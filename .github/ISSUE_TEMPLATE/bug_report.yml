name: Bug report
description: Report a reproducible TypeLens defect using synthetic source.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, proprietary source, private paths, or full model requests. Use SECURITY.md for vulnerabilities."
  - type: input
    id: versions
    attributes:
      label: TypeLens, DSH, and Node.js versions
      placeholder: TypeLens 0.1.1; DSH 0.1.1-rc.2; Node.js 24
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, proprietary source, private paths, and model-provider data.
          required: true
