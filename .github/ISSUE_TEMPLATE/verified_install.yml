name: Verified DSH install report
description: Report a real, privacy-safe TypeLens installation outcome
title: "install: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Report whether the npm package composed into a real DSH profile. Include no secrets, private paths, proprietary source, or model-provider data.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.1.1-rc.2
    validations:
      required: true
  - type: input
    id: typelens-version
    attributes:
      label: TypeLens version
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - Web
        - Headless
        - Both
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - Linux amd64
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Observed result
      options:
        - Installed and produced context or diagnostics
        - Installed with a workaround
        - Installation or execution failed
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence or workaround
      description: Include package versions, file type, diagnostic code, and bounded source-free output only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no secrets, private paths, proprietary source, or model-provider data.
          required: true
