name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:site
      - run: pnpm test:public
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run check:secrets
      - run: pnpm pack --pack-destination artifacts
      - run: pnpm run audit:package -- artifacts/dsh-typelens-0.1.1.tgz
